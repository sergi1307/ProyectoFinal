name: Nexus

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: administrador
      MYSQL_USER: nexus
      MYSQL_PASSWORD: nexus
      MYSQL_DATABASE: Nexus
    volumes:
      - Nexus:/var/lib/mysql
    ports:
      - "3306:3306"

  php:
    build: ./php
    volumes:
      - ./src:/var/www/html
      - ./php/conf.d/99-xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: nexus
      MYSQL_PASSWORD: nexus
      MYSQL_DB: Nexus
    depends_on:
      - mysql

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

volumes:
  Nexus: